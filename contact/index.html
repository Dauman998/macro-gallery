<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Dan Bauman Photography</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
      background-color: #f9f6f2;
      display: flex;
      flex-direction: column;
    }

    /* HEADER                                                             */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: #f9f6f2;
      padding: 1.4rem 2.8rem;
      border-bottom: 1px solid rgba(0,0,0,0.10);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
    }

    .text-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
    }

    .name-line {
      font-family: "Figtree", sans-serif;
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: rgba(0,0,0,0.80);
      line-height: 1;
    }

    .tagline-line {
      font-family: "Figtree", sans-serif;
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: rgba(0,0,0,0.80);
      line-height: 1;
    }

    .vertical-line {
      width: 1px;
      height: 3.8rem;
      background: rgba(0,0,0,0.80);
    }

    .hamburger-menu {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 0.5rem;
      margin-right: 0.4rem;
    }

    .hamburger-menu span {
      display: block;
      width: 34px;
      height: 2px;
      background: rgba(0,0,0,0.80);
      transition: transform 0.3s, opacity 0.3s;
    }

    .hamburger-menu.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
    .hamburger-menu.active span:nth-child(2) { opacity: 0; }
    .hamburger-menu.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

    .main-nav {
      position: fixed;
      top: 0; right: -320px;
      width: 280px;
      height: 100vh;
      background: rgba(249,246,242,0.98);
      z-index: 99;
      transition: right 0.35s ease;
      padding-top: 6rem;
      padding-left: 2rem;
      border-left: 1px solid rgba(0,0,0,0.08);
    }

    .main-nav.active { right: 0; }

    .main-nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .main-nav a {
      font-family: "Figtree", sans-serif;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: rgba(0,0,0,0.45);
      transition: color 0.2s;
    }

    .main-nav a:hover,
    .main-nav a.active { color: rgba(0,0,0,0.90); }

    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.2);
      z-index: 98;
    }

    .menu-overlay.active { display: block; }

    /* PAGE                                                               */
    .contact-page {
      flex: 1;
      background-color: #f9f6f2;
      padding: 0 2rem;
      padding-top: 7rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      height: 100vh;
    }

    /* OUTER BOX                                                          */
    .contact-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: calc((100vh - 7rem) * 0.75);
      border-radius: 8px;
      overflow: hidden;
      background-image: url('macro.jpg');  /* <- swap macro image filename here */
      background-size: cover;
      background-position: center center;
      background-color: #c8c8c8;           /* <- placeholder until image added  */
    }

    /* FORM OVERLAY — full container, form pinned to bottom              */
    .contact-form-section {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(249,246,242,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.8rem 1.5rem;
    }

    /* "Send a Message" sits just above the Name field                   */
    .contact-form-section h3 {
      font-family: "Figtree", sans-serif;
      font-size: clamp(0.75rem, 1vw, 0.95rem);
      font-weight: 300;
      color: rgba(0,0,0,0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 520px;
    }

    /* FORM — wider fields                                                */
    .contact-form {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      max-width: 520px;               /* <- wider than before (was 380px) */
    }

    .form-group { display: flex; flex-direction: column; padding-bottom: 1rem; }
    .form-group:last-of-type { padding-bottom: 0; }

    .form-group label {
      font-family: "DM Sans", sans-serif;
      font-size: 0.62rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.45);
      margin-bottom: 0.35rem;
      font-weight: 400;
    }

    .form-group input,
    .form-group textarea {
      background: rgba(249,246,242,0.85);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: rgba(0,0,0,0.80);
      font-family: "DM Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 300;
      transition: border-color 0.25s, background 0.25s;
      width: 100%;
    }

    .form-group input:hover, .form-group textarea:hover {
      border-color: rgba(0,0,0,0.32);
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: rgba(0,0,0,0.50);
      background: #f9f6f2;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }

    .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    button[type="submit"] {
      align-self: center;
      min-width: 100px;
      cursor: pointer;
      margin-top: 1.8rem;
      padding: 0.55rem 1.8rem;
      background: rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.22);
      border-radius: 6px;
      color: rgba(0,0,0,0.80);
      font-family: "DM Sans", sans-serif;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
      transition: background 0.2s, border-color 0.2s, transform 0.12s;
    }

    button[type="submit"]:hover {
      background: rgba(0,0,0,0.14);
      border-color: rgba(0,0,0,0.40);
      transform: translateY(-1px);
    }

    .form-status {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: rgba(0,0,0,0.40);
      min-height: 1.2em;
      text-align: center;
    }

    /* SOCIAL ICONS                                                       */
    .page-social {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      padding: 0.8rem 0 0.4rem;
    }

    .social-icon {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: none;
      transition: transform 0.15s, opacity 0.2s;
    }

    .social-icon:hover { transform: translateY(-2px); opacity: 0.85; }
    .social-icon svg { width: 22px; height: 22px; fill: #fff; }
    .social-icon.instagram { background: #111; }
    .social-icon.facebook { background: #111; }

    /* MOBILE                                                             */
    @media (max-width: 760px) {
      .contact-form-section {
        position: relative;
        width: 100%;
        height: auto;
        background: #f9f6f2;
        backdrop-filter: none;
        padding: 2rem 1.2rem;
        justify-content: center;
      }
      .contact-page { padding: 7rem 1.2rem 6rem; height: auto; }
      .contact-container { height: auto; background-image: none; background-color: transparent; }
      .page-social {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        max-width: 100%;
        justify-content: center;
        padding: 0.8rem 0;
        background: rgba(249,246,242,0.90);
        backdrop-filter: blur(8px);
        z-index: 90;
      }
    }

  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1 class="logo-with-line">
        <a href="../index.html" class="logo-link">
          <span class="text-stack">
            <span class="name-line">dan bauman</span>
            <span class="tagline-line">photography</span>
          </span>
          <span class="vertical-line" aria-hidden="true"></span>
        </a>
      </h1>
      <button class="hamburger-menu" aria-label="Menu" id="hamburger" type="button">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../gallery.html">Portfolio</a></li>
        <li><a href="../about.html">About</a></li>
        <li><a href="./" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact-page">
    <div class="contact-container" id="contactContainer">

      <section class="contact-form-section">
        <h3>Send a Message</h3>
        <form class="contact-form" id="contactForm" action="https://formspree.io/f/xkoqgzdo" method="POST">

          <div class="form-group" id="nameGroup">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" autocomplete="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" />
          </div>

          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="3" required></textarea>
          </div>

          <button type="submit" id="sendBtn">Send</button>
          <p id="formStatus" class="form-status" aria-live="polite"></p>

        </form>
      </section>

    </div>

    <div class="page-social" aria-label="Social links">
      <a class="social-icon instagram" href="https://www.instagram.com/macronovo/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5Zm10.0 1.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
      </a>
      <a class="social-icon facebook" href="https://www.facebook.com/danbaumanphotography" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.9.2-1.5 1.6-1.5H16.7V5c-.3 0-1.4-.1-2.6-.1-2.6 0-4.3 1.6-4.3 4.5V11H7.2v3h2.6v8h3.7Z"/></svg>
      </a>
    </div>

  </main>

  <script src="../navigation.js"></script>

  <script>
    const contactForm = document.getElementById("contactForm");
    const statusEl    = document.getElementById("formStatus");

    contactForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "Sending...";
      try {
        const res = await fetch(contactForm.action, {
          method: "POST",
          body: new FormData(contactForm),
          headers: { Accept: "application/json" }
        });
        if (res.ok) {
          statusEl.textContent = "Thanks! Your message was sent.";
          contactForm.reset();
        } else {
          statusEl.textContent = "Sorry - something went wrong. Please try again.";
        }
      } catch {
        statusEl.textContent = "Network error - please check your connection.";
      }
    });
  </script>

</body>
</html>
